name: Release

# Push a version tag on main (git tag -a v1.2.0 -m "Inkline v1.2.0" && git push origin v1.2.0)
# and this publishes the GitHub release "Inkline v1.2.0" with that version's CHANGELOG.md entry.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # main and all tags, to check where the tag sits and find the previous release

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main. Merge first, then tag the commit on main."
            exit 1
          fi

      - name: tokens.css matches tokens.json
        run: python3 scripts/check_tokens.py

      - name: Version lines match the tag
        run: python3 scripts/check_versions.py "$GITHUB_REF_NAME"

      - name: bundle.js parses
        run: node --check components/bundle.js

      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/changelog_notes.py "$GITHUB_REF_NAME" > notes.md
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n**Full diff:** %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Inkline $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Re-run after a fix: refresh the existing release instead of failing.
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            # Versions with a suffix (2.0.0-rc.1) are pre-releases. Otherwise GitHub
            # marks the release Latest unless it's older than the current latest.
            prerelease=()
            case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes-file notes.md "${prerelease[@]}"
          fi
